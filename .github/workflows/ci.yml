name: CI

# Runs on every push to any branch, and on every PR targeting main.
# Purpose: typecheck, build, and test the full monorepo before anything merges.
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Typecheck · Build · Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # ── Service containers ────────────────────────────────────────────────────
    # Matching exactly the versions used in docker-compose.yml:
    #   postgres:16-alpine   (same as opspilot-postgres local container)
    #   redis:7.2-alpine     (same as opspilot-redis local container)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opspilot
          POSTGRES_PASSWORD: opspilot
          POSTGRES_DB: opspilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opspilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Setup pnpm (must come before setup-node to enable caching) ───────
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.20.0'   # exact version from packageManager field in package.json

      # ── 3. Setup Node.js ────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'   # LTS; satisfies engines >=22.13.0 in package.json
          cache: 'pnpm'

      # ── 4. Install dependencies ──────────────────────────────────────────────
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── 5. Apply database migrations ─────────────────────────────────────────
      # Runs against the postgres service container above.
      # Uses prisma migrate deploy (never db push) — same command as production.
      - name: Apply database migrations
        run: pnpm db:migrate
        env:
          # Points at the service container; vitest.config.ts also reads
          # TEST_DATABASE_URL and overrides DATABASE_URL at test time.
          DATABASE_URL: postgresql://opspilot:opspilot@localhost:5432/opspilot_test?sslmode=disable
          TEST_DATABASE_URL: postgresql://opspilot:opspilot@localhost:5432/opspilot_test?sslmode=disable

      # ── 6. Typecheck ─────────────────────────────────────────────────────────
      - name: Typecheck
        run: pnpm typecheck
        env:
          DATABASE_URL: postgresql://opspilot:opspilot@localhost:5432/opspilot_test?sslmode=disable
          TEST_DATABASE_URL: postgresql://opspilot:opspilot@localhost:5432/opspilot_test?sslmode=disable
          # CI-only dummy JWT_SECRET — satisfies config validation during type-checking.
          # Not a real secret; value is intentionally hardcoded here and not stored
          # in GitHub Secrets. It is only used to prevent "JWT_SECRET is required"
          # config errors; it never signs real tokens in CI.
          JWT_SECRET: ci-only-dummy-jwt-secret-not-used-in-production-min-32-chars

      # ── 7. Build ─────────────────────────────────────────────────────────────
      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://opspilot:opspilot@localhost:5432/opspilot_test?sslmode=disable
          TEST_DATABASE_URL: postgresql://opspilot:opspilot@localhost:5432/opspilot_test?sslmode=disable
          JWT_SECRET: ci-only-dummy-jwt-secret-not-used-in-production-min-32-chars

      # ── 8. Test ──────────────────────────────────────────────────────────────
      # turbo run test depends on ^build (already done above via pnpm build).
      # vitest.config.ts overrides DATABASE_URL → TEST_DATABASE_URL at runtime
      # and sets all ENABLE_* feature flags to true for the test suite.
      # --force bypasses turbo's cache: test files are not tracked as build inputs
      # by default, so without --force turbo serves stale cached results when only
      # test files change — causing false greens. Always re-run tests fresh in CI.
      - name: Test
        run: pnpm test
        env:
          TURBO_FORCE: "true"
          DATABASE_URL: postgresql://opspilot:opspilot@localhost:5432/opspilot_test?sslmode=disable
          TEST_DATABASE_URL: postgresql://opspilot:opspilot@localhost:5432/opspilot_test?sslmode=disable
          JWT_SECRET: ci-only-dummy-jwt-secret-not-used-in-production-min-32-chars
          REDIS_URL: redis://localhost:6379

      # ── 9. Dependency vulnerability scan (report-only) ──────────────────────
      # Runs pnpm audit at the high+ severity level and prints a findings summary.
      # First-run policy: `|| true` so this NEVER blocks CI on the baseline scan.
      # Once the baseline is reviewed and addressed, remove `|| true` to enforce.
      - name: Dependency audit (report-only)
        run: |
          echo "=== pnpm audit findings ==="
          pnpm audit --audit-level=high 2>&1 || true
          echo "=== audit scan complete (report-only — does not block CI) ==="

      # ── 10. Secret scan with gitleaks (report-only) ────────────────────────
      # Full-history scan on the first run to surface any historical leaks.
      # Incremental on subsequent PRs (HEAD only via --baseline-path).
      # First-run policy: report-only (failure-exit-code 0).
      # Once baseline is reviewed, set failure-exit-code to 1 to enforce.
      - name: Secret scan — gitleaks (report-only)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Report-only: don't fail the build until baseline is acknowledged.
          # Remove/change when ready to enforce: set GITLEAKS_ENABLE_UPLOAD_ARTIFACT
          # and use a .gitleaks.toml allowlist for known CI-dummy values.
          GITLEAKS_ENABLE_COMMENTS: false
        continue-on-error: true
