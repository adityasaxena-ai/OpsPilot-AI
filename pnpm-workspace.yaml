packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  argon2: true
  esbuild: true
  prisma: true
  puppeteer: true

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - esbuild
  - prisma

overrides:
  js-yaml: "^4.3.2"
  fast-uri: ">=3.1.7"
  find-my-way: "^9.6.1"
  "@fastify/static": "^10.1.2"
  nanoid: "^3.3.18"
  cross-spawn: "^7.0.6"
  vite: "^6.4.3"
  vitest: "^3.2.6"
  express: "^4.21.2"
  tinypool: ">=2.1.2"
  fastify: ">=5.12.2"
  source-map-js: ">=1.2.2"
  "brace-expansion@<2": ">=1.1.20 <2"
  "brace-expansion@>=2 <3": ">=2.1.6 <3"
  "brace-expansion@>=4 <6": ">=5.0.11"

auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
